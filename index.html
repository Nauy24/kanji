<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji Quizlet Mobile</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:"Noto Sans", system-ui, sans-serif;
  background:#eaf4f4;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* ===== DROPDOWN ===== */
.dropdown-wrapper{
  width:94vw;
  display:flex;
  gap:10px;
  margin-bottom:2vh;
}

select{
  flex:1;
  padding:12px;
  font-size:4.5vw;
  border-radius:14px;
  border:none;
  background:#ffffff;
  box-shadow:0 6px 14px rgba(0,0,0,0.08);
  text-align:center;
  text-align-last:center;
  font-weight:700;
}

/* ===== CARD ===== */
.card{
  width:94vw;
  height:75vh;
  background:#fdfefe;
  border-radius:22px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  padding:4vh 4vw;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  cursor:pointer;
}

.front,.back{width:100%;}
.back{display:none;}

.kanji{
  font-family:"Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif;
  font-size:18vw;
  font-weight:bold;
  color:#2f5d62;
}

/* ===== BACK ===== */
.reading{
  font-size:13vw;
  margin-bottom:2vh;
  color:#4a7c7d;
  font-weight:700;
}

.meaning{
  font-size:6vw;
  font-weight:bold;
  margin-bottom:2vh;
}

.divider{
  border-top:2px solid #9dc5c3;
  margin:2vh 0;
}

.hanviet{
  font-size:6vw;
  font-weight:bold;
  color:#355f5b;
}

.backKanji{
  font-family:"MS Mincho",serif;
  font-size:10vw;
  font-weight:bold;
  margin-bottom:1vh;
  color:#2f5d62;
}

/* ===== INFO BAR ===== */
.info-bar{
  width:100%;
  padding:10px 14px;
  background:#f7fbfb;
  border-bottom:1px solid #dceeee;
}

.info-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
}

.progress-wrapper{
  width:100%;
  height:6px;
  background:#e3f0ef;
  border-radius:10px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#4facfe,#00f2fe);
  transition:width 0.3s ease;
  border-radius:10px;
}

/* Counter PRO */
#counter{
  padding:6px 16px;
  background:linear-gradient(135deg,#2f5d62,#3f7d84);
  color:#fff;
  border-radius:999px;
  font-weight:bold;
  font-size:4.2vw;
  letter-spacing:0.5px;
  box-shadow:0 6px 14px rgba(0,0,0,0.15);
}

/* Lesson tag */
#lessonInfo{
  padding:6px 14px;
  background:#e3f0ff;
  color:#1f5fbf;
  border-radius:999px;
  font-size:3.8vw;
  font-weight:600;
}

/* Progress bar */
.progress-bar{
  height:8px;
  width:100%;
  background:#dceeee;
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#2f5d62,#5fb0b7);
  border-radius:999px;
  transition:width 0.3s ease;
}

/* Switch style */
.switch{
  position:relative;
  width:44px;
  height:24px;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  cursor:pointer;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:#ccc;
  border-radius:999px;
  transition:0.3s;
}

.slider:before{
  content:"";
  position:absolute;
  height:18px;
  width:18px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:0.3s;
}

.switch input:checked + .slider{
  background:#2f5d62;
}

.switch input:checked + .slider:before{
  transform:translateX(20px);
}

/* ===== CONTROLS ===== */
.controls{
  display:flex;
  width:100%;
  gap:6px;
}

.controls button{
  flex:1;
  height:50px;
  border:none;
  border-radius:12px;
  font-size:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;

  background:#9dc5c3;   /* cùng màu nền chính */
  color:black;
  transition:0.2s;
}

/* 🔊 lớn hơn xíu nhưng cùng màu */
.controls .btn-audio{
  flex:1.3;
}

/* hiệu ứng nhấn nhẹ */
.controls button:active{
  transform:scale(0.96);
  opacity:0.85;
}

</style>
</head>

<body>

<div class="dropdown-wrapper">
  <select id="levelSelect"></select>
  <select id="lessonSelect"></select>
</div>

<div class="card" onclick="toggleCard()">
  <div class="front">
    <div class="kanji" id="kanji"></div>
  </div>

  <div class="back">
    <div class="reading" id="reading"></div>
    <div class="meaning" id="meaning"></div>
    <div class="divider"></div>
	<div class="backKanji" id="backKanji"></div>
    <div class="hanviet" id="hanviet"></div>
  </div>
</div>

<div class="info-bar">

  <div class="info-top">

    <!-- Học liên bài -->
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:3.8vw;font-weight:600;color:#355f5b;">
        Học liên bài
      </span>

      <label class="switch">
        <input type="checkbox" id="multiLesson" onchange="render()">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Counter -->
    <span id="counter" style="font-weight:600;"></span>

    <!-- Lesson -->
    <span id="lessonInfo"></span>

  </div>

  <!-- Progress -->
  <div class="progress-wrapper">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div id="progressText" style="font-size:12px;margin-top:4px;color:#666;"></div>

</div>

<div class="controls">
<button onclick="prevCard(event)">◀</button>
<button onclick="toggleCard(event)">🔄</button>
<button onclick="nextCard(event)">▶</button>
<button onclick="shuffleCards(event)">🔀</button>
<button class="btn-audio" onclick="speak(event)">🔊</button>
</div>
<script src="data.js"></script>
<script>

const levelShort={
  "Nhập môn":"NM",
  "Sơ cấp 1":"SC1",
  "Sơ cấp 2":"SC2"
};

let data=[],index=0,front=true;
let currentLevel="",currentLesson="";
let isShuffled = false;
let originalData = [];

const levelSelect=document.getElementById("levelSelect");
const lessonSelect=document.getElementById("lessonSelect");

/* ===== INIT ===== */
function init(){
  Object.keys(lessons).forEach(level=>{
    const opt=document.createElement("option");
    opt.value=level;
    opt.textContent=level;
    levelSelect.appendChild(opt);
  });

  levelSelect.onchange=loadLessons;
  lessonSelect.onchange=loadCards;

  levelSelect.value=Object.keys(lessons)[0];
  loadLessons();
}

function loadLessons(){
  currentLevel=levelSelect.value;
  lessonSelect.innerHTML="";
  Object.keys(lessons[currentLevel]).forEach(lesson=>{
    const opt=document.createElement("option");
    opt.value=lesson;
    opt.textContent=lesson;
    lessonSelect.appendChild(opt);
  });
  lessonSelect.value=Object.keys(lessons[currentLevel])[0];
  loadCards();
}

function loadCards(){
  currentLesson = lessonSelect.value;
  data = [...lessons[currentLevel][currentLesson]];
  originalData = [...data]; // lưu bản gốc
  index = 0;
  isShuffled = false;
  updateShuffleButton();
  render();
}

/* ===== RENDER ===== */

function getTotalProgress(){

  const lessonsList = Array.from(lessonSelect.options).map(o => o.value);

  let totalLength = 0;
  let totalIndex = 0;

  // Tính tổng toàn level
  lessonsList.forEach(lesson=>{
    totalLength += lessons[currentLevel][lesson].length;
  });

  // Tính vị trí hiện tại
  for(let lesson of lessonsList){

    if(lesson === currentLesson){
      totalIndex += index + 1;
      break;
    }else{
      totalIndex += lessons[currentLevel][lesson].length;
    }

  }

  return { totalIndex, totalLength };
}

function render(){

  if(!data || data.length === 0) return;

  const item = data[index];

  document.getElementById("kanji").innerText = item.kanji;
  document.getElementById("reading").innerText = item.reading;
  document.getElementById("meaning").innerText = item.meaning;
  document.getElementById("hanviet").innerText = "Hán Việt: " + item.hanviet;

  document.getElementById("backKanji").innerText = item.kanji;

  const multi = document.getElementById("multiLesson").checked;

  let currentIndex;
  let totalLength;

  if(multi){
    const progress = getTotalProgress();
    currentIndex = progress.totalIndex;
    totalLength = progress.totalLength;
  }else{
    currentIndex = index + 1;
    totalLength = data.length;
  }

  // tránh chia cho 0
  if(totalLength === 0) totalLength = 1;

  counter.innerText = currentIndex + " / " + totalLength;

  // ===== CẬP NHẬT PROGRESS BAR =====
  let percent = Math.round((currentIndex / totalLength) * 100);

  document.getElementById("progressFill").style.width = percent + "%";
  document.getElementById("progressText").innerText = percent + "%";
  // ==================================

  lessonInfo.innerText = levelShort[currentLevel] + " - " + currentLesson;

  
}

/* ===== CARD ===== */
function toggleCard(e){
  if(e) e.stopPropagation();
  front?showBack():showFront();
}
function showFront(){
  front=true;
  document.querySelector(".front").style.display="block";
  document.querySelector(".back").style.display="none";
}
function showBack(){
  front=false;
  document.querySelector(".front").style.display="none";
  document.querySelector(".back").style.display="block";
}

/* ===== NAV ===== */
function nextCard(e){
  e.stopPropagation();

  const card = document.querySelector(".card");
  const wasFlipped = card.classList.contains("flip"); // 👈 đọc trạng thái thật

  const multi = document.getElementById("multiLesson").checked;

  if(index < data.length - 1){
    index++;
  }else{
    if(multi){
      const lessonsList = Object.keys(lessons[currentLevel]);
      let lessonIdx = lessonsList.indexOf(currentLesson);

      if(lessonIdx < lessonsList.length - 1){
        lessonIdx++;
      }else{
        lessonIdx = 0;
      }

      currentLesson = lessonsList[lessonIdx];
lessonSelect.value = currentLesson;

data = [...lessons[currentLevel][currentLesson]];
originalData = [...data];

// 🔥 nếu đang bật shuffle thì shuffle bài mới luôn
if(isShuffled){
  for(let i = data.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [data[i], data[j]] = [data[j], data[i]];
  }
}

index = 0;
    }else{
      index = 0;
    }
  }

  render();

  // 🔥 khôi phục trạng thái lật
  if(wasFlipped){
    card.classList.add("flip");
  }
}
function prevCard(e){
  e.stopPropagation();

  const multi = document.getElementById("multiLesson").checked;

  if(index > 0){
    index--;
  }else{
    if(multi){
      const lessonsList = Object.keys(lessons[currentLevel]);
      let lessonIdx = lessonsList.indexOf(currentLesson);

      if(lessonIdx > 0){
        lessonIdx--;
      }else{
        lessonIdx = lessonsList.length - 1;
      }

      currentLesson = lessonsList[lessonIdx];
lessonSelect.value = currentLesson;

data = [...lessons[currentLevel][currentLesson]];
originalData = [...data];

// 🔥 nếu đang bật shuffle thì shuffle bài mới luôn
if(isShuffled){
  for(let i = data.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [data[i], data[j]] = [data[j], data[i]];
  }
}

index = data.length - 1;
    }
  }

  render();
}

/* ===== SHUFFLE ===== */
function shuffleCards(e){
  e.stopPropagation();

  const btn = e.currentTarget;

  if(!isShuffled){
    data.sort(()=>Math.random()-0.5);
    isShuffled = true;
  }else{
    data = [...originalData]; // trả về thứ tự ban đầu
    isShuffled = false;
  }

  index = 0;
  updateShuffleButton();
  render();
}

function updateShuffleButton(){
  const btn = document.querySelector(".controls button:nth-child(4)");

  if(isShuffled){
    btn.style.background = "#2f5d62";
    btn.style.color = "white";
    btn.style.transform = "scale(1.05)";
  }else{
    btn.style.background = "#9dc5c3";
    btn.style.color = "black";
    btn.style.transform = "scale(1)";
  }
}

/* ===== AUDIO ===== */
function speak(){
  const u=new SpeechSynthesisUtterance(data[index].reading);
  u.lang="ja-JP";
  u.rate=0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

init();
</script>

</body>
</html>
